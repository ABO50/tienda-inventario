<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión · Atelier Rosa</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="pagina-login">

    <main class="tarjeta-login vidrio">
        <a href="index.html" class="logo-login">Atelier Rosa</a>

        <h1 id="titulo-login">Iniciar sesión</h1>
        <p id="subtitulo-login" class="subtitulo-login">Entra para administrar tu inventario.</p>

        <form id="formulario-login" class="formulario-login" novalidate>

            <div class="campo">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" autocomplete="email" required>
            </div>

            <div class="campo">
                <label for="contrasena">Contraseña</label>
                <div class="campo-contrasena">
                    <input type="password" id="contrasena" name="contrasena" autocomplete="current-password" minlength="6" required>
                    <button type="button" class="ver-contrasena" data-ver-contrasena="contrasena" aria-pressed="false" aria-label="Mostrar contraseña">Mostrar</button>
                </div>
            </div>

            <button type="button" id="boton-olvide" class="enlace-boton enlace-olvide">¿Olvidaste tu contraseña?</button>

            <!-- Aquí se muestran los errores y avisos -->
            <p id="mensaje" class="mensaje" role="alert" aria-live="polite"></p>

            <button type="submit" id="boton-enviar" class="boton-detalles">Iniciar sesión</button>
        </form>

        <p class="cambiar-modo">
            <span id="texto-cambiar">¿Aún no tienes cuenta?</span>
            <button type="button" id="boton-cambiar" class="enlace-boton">Crear cuenta</button>
        </p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/ver-contrasena.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
